name: Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libgtk-3-dev \
          libglfw3-dev \
          libcurl4-openssl-dev \
          pkg-config

    - name: Setup Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true

    - name: Configure CMake
      run: >-
        cmake -S . -B build
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DBUILD_GAMES=ON
        -DFRAMETEE_BUILD_TMNF=ON
        -DFRAMETEE_BUILD_CUBE_EXAMPLE=OFF
        -DFRAMETEE_BUILD_PLATFORMER_EXAMPLE=OFF
        -DFRAMETEE_BUILD_RUST_EXAMPLE=OFF

    - name: Build
      run: cmake --build build --config RelWithDebInfo --parallel

    - name: Prepare Artifact
      run: |
        set -euo pipefail
        mkdir -p artifact/frametee-linux/games
        mkdir -p artifact/frametee-linux/plugins
        cp build/frametee artifact/frametee-linux/
        cp -r build/data artifact/frametee-linux/
        find build/games -maxdepth 1 \( -type f -o -type l \) \
          -name "*.so*" -exec cp -a {} artifact/frametee-linux/games/ \;
        if [ -d "build/plugins" ]; then
          find build/plugins -maxdepth 1 \( -type f -o -type l \) \
            -name "*.so*" -exec cp -a {} artifact/frametee-linux/plugins/ \;
        fi

        # Preserve the relative locations encoded in the modules' $ORIGIN
        # runpaths instead of flattening same-named libraries into one folder.
        while IFS= read -r library; do
          destination="artifact/frametee-linux/${library#build/}"
          mkdir -p "$(dirname "$destination")"
          cp -a "$library" "$destination"
        done < <(find build/libs \( -type f -o -type l \) -name "*.so*" -print)

        (
          cd artifact/frametee-linux
          test -f data/games/ddnet/shaders/map.frag.spv
          test -f data/games/ddnet/skins/default.png
          test -f data/games/tmnf/thumbnail.png
          test -f data/games/tmnf/README.txt
          ./frametee --list-games | tee game-modules.txt
          grep -Eq '^  ddnet[[:space:]]' game-modules.txt
          grep -Eq '^  tmnf[[:space:]]' game-modules.txt
          find . -type f -print | sort > artifact-manifest.txt
        )

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frametee-linux
        path: artifact/frametee-linux/

  build-windows:
    name: Windows (MinGW-w64)
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MinGW-w64 environment
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        cache: true
        path-type: strict
        pacboy: >-
          toolchain:p
          cmake:p
          ninja:p
          pkgconf:p
          curl:p
          openssl:p
          zlib:p
          glfw:p
          vulkan-headers:p
          vulkan-loader:p
          glslang:p

    - name: Configure CMake
      shell: msys2 {0}
      run: >-
        cmake -S . -B build -G Ninja
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DBUILD_GAMES=ON
        -DFRAMETEE_BUILD_TMNF=ON
        -DFRAMETEE_BUILD_CUBE_EXAMPLE=OFF
        -DFRAMETEE_BUILD_PLATFORMER_EXAMPLE=OFF
        -DFRAMETEE_BUILD_RUST_EXAMPLE=OFF

    - name: Build
      shell: msys2 {0}
      run: cmake --build build --config RelWithDebInfo --parallel

    - name: Prepare Artifact
      shell: msys2 {0}
      run: |
        set -euo pipefail
        mkdir -p artifact/frametee-windows/games
        mkdir -p artifact/frametee-windows/plugins
        cp build/frametee.exe artifact/frametee-windows/
        cp -r build/data artifact/frametee-windows/
        find build/games -maxdepth 1 -type f -iname "*.dll" \
          -exec cp {} artifact/frametee-windows/games/ \;
        if [ -d "build/plugins" ]; then
          find build/plugins -maxdepth 1 -type f -iname "*.dll" \
            -exec cp {} artifact/frametee-windows/plugins/ \;
        fi

        # Libraries built as dependencies rather than as modules (currently
        # cglm) also have to ship. Put them beside the executable, which is in
        # the Windows DLL search path for games and plugins alike.
        while IFS= read -r library; do
          cp "$library" artifact/frametee-windows/
        done < <(find build -type f -iname "*.dll" \
          ! -path "build/games/*" ! -path "build/plugins/*" -print)

        # MinGW, curl, OpenSSL, and zlib are dynamically linked. ldd reports
        # the complete transitive UCRT64 DLL closure for the executable and
        # every loadable game/plugin; Windows finds these beside frametee.exe.
        runtime_list="artifact/frametee-windows/runtime-dlls.txt"
        export PATH="$PWD/artifact/frametee-windows:$PATH"
        while IFS= read -r binary; do
          ldd "$binary" || true
        done < <(find artifact/frametee-windows -type f \
          \( -iname "*.exe" -o -iname "*.dll" \) -print) |
          awk '$3 ~ /^\/ucrt64\/bin\/.*\.dll$/ { print $3 }' |
          sort -u > "$runtime_list"
        while IFS= read -r library; do
          [ -z "$library" ] || cp "$library" artifact/frametee-windows/
        done < "$runtime_list"

        while IFS= read -r binary; do
          if ldd "$binary" | grep -q "not found"; then
            ldd "$binary"
            exit 1
          fi
        done < <(find artifact/frametee-windows -type f \
          \( -iname "*.exe" -o -iname "*.dll" \) -print)

        (
          cd artifact/frametee-windows
          test -f data/games/ddnet/shaders/map.frag.spv
          test -f data/games/ddnet/skins/default.png
          test -f data/games/tmnf/thumbnail.png
          test -f data/games/tmnf/README.txt
          ./frametee.exe --list-games | tee game-modules.txt
          grep -Eq '^  ddnet[[:space:]]' game-modules.txt
          grep -Eq '^  tmnf[[:space:]]' game-modules.txt
          find . -type f -print | sort > artifact-manifest.txt
        )

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frametee-windows
        path: artifact/frametee-windows/

  release:
    name: Create Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create archives
      run: |
        cd artifacts/frametee-linux
        tar -czvf ../../frametee-linux.tar.gz *
        cd ../frametee-windows
        zip -r ../../frametee-windows.zip *
        cd ../..

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          frametee-linux.tar.gz
          frametee-windows.zip
        generate_release_notes: true
