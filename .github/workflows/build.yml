name: Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libgtk-3-dev \
          libglfw3-dev \
          libcurl4-openssl-dev \
          libfreetype6-dev \
          pkg-config

    - name: Setup Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true

    - name: Configure CMake
      run: >-
        cmake -S . -B build
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_GAMES=ON
        -DBUILD_PLUGINS=ON
        '-DFRAMETEE_PLUGIN_ALLOWLIST=example_c;example_cpp;physics_profiler;random_input_filler'
        -DFRAMETEE_BUILD_TMNF=ON
        -DFRAMETEE_BUILD_CUBE_EXAMPLE=OFF
        -DFRAMETEE_BUILD_PLATFORMER_EXAMPLE=OFF
        -DFRAMETEE_BUILD_RUST_EXAMPLE=OFF

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Prepare Artifact
      run: |
        set -euo pipefail
        cmake --install build \
          --prefix "$PWD/artifact/frametee-linux" \
          --component Runtime \
          --strip

        (
          cd artifact/frametee-linux
          test -f data/games/ddnet/shaders/map.frag.spv
          test -f data/games/ddnet/skins/default.png
          test -f data/games/ddnet/textures/emoticons.png
          test -f data/fonts/DejaVuSans.ttf
          test -f data/fonts/DejaVuSans-LICENSE.txt
          test -f data/games/tmnf/thumbnail.png
          test -f data/games/tmnf/README.txt
          # A plugin is a directory holding its library, its manifest and any
          # resources it ships. The directory names the plugin on every
          # platform, and the library inside carries that name.
          test -f plugins/example_c/libexample_c.so
          test -f plugins/example_cpp/libexample_cpp.so
          test -f plugins/physics_profiler/libphysics_profiler.so
          test -f plugins/random_input_filler/librandom_input_filler.so
          test -f plugins/physics_profiler/plugin.toml
          test -f plugins/random_input_filler/plugin.toml
          test -z "$(find plugins -type f ! -name '*.so*' ! -name '*.toml' -print -quit)"
          test ! -d data/textures
          test ! -f data/fonts/JetBrainsMono-Medium.ttf
          test -z "$(find . -type f \( -name '*.o' -o -name '*.a' -o -name '*.cmake' -o -name '*.pdb' -o -name '*.glsl' \) -print -quit)"
          find . -type f -print | sort
        )

    - name: Verify Relocated Artifact
      run: |
        set -euo pipefail
        # Run the smoke test from a copy that has no build tree next to it. In
        # place, an absolute build-tree RUNPATH resolves and hides exactly the
        # breakage users hit after unpacking a release elsewhere.
        relocated="$RUNNER_TEMP/frametee-relocated"
        rm -rf "$relocated"
        mkdir -p "$relocated"
        cp -a artifact/frametee-linux/. "$relocated/"
        rm -rf build

        cd "$relocated"
        while IFS= read -r binary; do
          resolved=$(ldd "$binary")
          if grep -q "not found" <<<"$resolved"; then
            echo "::error::$binary has unresolved libraries"
            printf '%s\n' "$resolved"
            exit 1
          fi
          # Everything has to come either from the bundle itself or from the
          # system; nothing may point back into the checkout.
          if grep -q "$GITHUB_WORKSPACE" <<<"$resolved"; then
            echo "::error::$binary still resolves libraries inside the checkout"
            printf '%s\n' "$resolved"
            exit 1
          fi
        done < <(find . -type f \( -name "frametee" -o -name "*.so*" \) -print)

        ./frametee --list-games | tee "$RUNNER_TEMP/frametee-game-modules.txt"
        grep -Eq '^  ddnet[[:space:]]' "$RUNNER_TEMP/frametee-game-modules.txt"
        grep -Eq '^  tmnf[[:space:]]' "$RUNNER_TEMP/frametee-game-modules.txt"

        # --list-games returns before the editor exists, so it says nothing
        # about whether the release can come up. An empty auto script runs the
        # real startup -- config, game activation, plugins -- with no window,
        # and the timeout turns a hang into a failed build rather than a white
        # window on a user's machine.
        smoke_config="$RUNNER_TEMP/frametee-config"
        rm -rf "$smoke_config"
        mkdir -p "$smoke_config/frametee"
        : > "$RUNNER_TEMP/frametee-smoke.ftscript"

        XDG_CONFIG_HOME="$smoke_config" timeout 120 \
          ./frametee --auto "$RUNNER_TEMP/frametee-smoke.ftscript" |
          tee "$RUNNER_TEMP/frametee-startup.txt"
        grep -q "Scanning for plugins" "$RUNNER_TEMP/frametee-startup.txt"
        grep -q "Auto script finished" "$RUNNER_TEMP/frametee-startup.txt"
        # Nothing is enabled in a fresh config, and a plugin that is not enabled
        # is not loaded at all -- being listed must never run its code.
        ! grep -q "Loaded '" "$RUNNER_TEMP/frametee-startup.txt"

        # Again with every shipped plugin turned on, which is the path that does
        # load, initialize, shut down and unload plugin code.
        {
          echo "[plugins]"
          for plugin in plugins/*/; do
            echo "$(basename "$plugin") = true"
          done
        } > "$smoke_config/frametee/config.toml"
        XDG_CONFIG_HOME="$smoke_config" timeout 120 \
          ./frametee --auto "$RUNNER_TEMP/frametee-smoke.ftscript" |
          tee "$RUNNER_TEMP/frametee-plugins.txt"
        grep -q "Loaded '" "$RUNNER_TEMP/frametee-plugins.txt"
        grep -q "Auto script finished" "$RUNNER_TEMP/frametee-plugins.txt"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frametee-linux
        path: artifact/frametee-linux/

  build-windows:
    name: Windows (MinGW-w64)
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MinGW-w64 environment
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        cache: true
        path-type: strict
        pacboy: >-
          toolchain:p
          cmake:p
          ninja:p
          pkgconf:p
          curl-winssl:p
          freetype:p
          openssl:p
          zlib:p
          glfw:p
          vulkan-headers:p
          vulkan-loader:p
          glslang:p

    - name: Configure CMake
      shell: msys2 {0}
      run: >-
        cmake -S . -B build -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_GAMES=ON
        -DBUILD_PLUGINS=ON
        '-DFRAMETEE_PLUGIN_ALLOWLIST=example_c;example_cpp;physics_profiler;random_input_filler'
        -DFRAMETEE_BUILD_TMNF=ON
        -DFRAMETEE_BUILD_CUBE_EXAMPLE=OFF
        -DFRAMETEE_BUILD_PLATFORMER_EXAMPLE=OFF
        -DFRAMETEE_BUILD_RUST_EXAMPLE=OFF

    - name: Build
      shell: msys2 {0}
      run: cmake --build build --config Release --parallel

    - name: Prepare Artifact
      shell: msys2 {0}
      run: |
        set -euo pipefail
        require_file() {
          if [ ! -f "$1" ]; then
            echo "::error::Required release file is missing: $1"
            exit 1
          fi
        }

        cmake --install build \
          --prefix "$PWD/artifact/frametee-windows" \
          --component Runtime \
          --strip

        # The application imports the Vulkan loader before main() is reached.
        # Bundle the redistributable loader deliberately instead of assuming a
        # graphics driver installed vulkan-1.dll system-wide. This fixes startup
        # on affected Intel integrated-graphics driver installations; the loader
        # still discovers the machine's actual Intel ICD through the registry.
        require_file /ucrt64/bin/vulkan-1.dll
        cp /ucrt64/bin/vulkan-1.dll artifact/frametee-windows/

        # MinGW, curl/Schannel, OpenSSL, and zlib are dynamically linked. ldd reports
        # the complete transitive UCRT64 DLL closure for the executable and
        # every loadable game; Windows finds these beside frametee.exe. Keep the
        # dependency report in the runner temp directory, outside the release.
        runtime_list="$RUNNER_TEMP/frametee-runtime-dlls.txt"
        export PATH="$PWD/artifact/frametee-windows:$PATH"
        while IFS= read -r binary; do
          ldd "$binary" || true
        done < <(find artifact/frametee-windows -type f \
          \( -iname "*.exe" -o -iname "*.dll" \) -print) |
          awk '$3 ~ /^\/ucrt64\/bin\/.*\.dll$/ { print $3 }' |
          sort -u > "$runtime_list"
        while IFS= read -r library; do
          [ -z "$library" ] || cp "$library" artifact/frametee-windows/
        done < "$runtime_list"

        while IFS= read -r binary; do
          if ldd "$binary" | grep -q "not found"; then
            ldd "$binary"
            exit 1
          fi
        done < <(find artifact/frametee-windows -type f \
          \( -iname "*.exe" -o -iname "*.dll" \) -print)

        # Exercise the same bundled libcurl DLL closure outside MSYS2's bin
        # directory. The WinSSL build uses Windows' Schannel trust store, so a
        # release does not depend on /ucrt64/etc/ssl existing on the end-user
        # machine. The normal OpenSSL curl build did, which made every HTTPS
        # map and skin request fail after the CA bundle was left out.
        network_smoke="$RUNNER_TEMP/frametee-network-smoke"
        mkdir -p "$network_smoke"
        cp /ucrt64/bin/curl.exe "$network_smoke/"
        find artifact/frametee-windows -maxdepth 1 -type f -iname "*.dll" \
          -exec cp {} "$network_smoke/" \;
        curl_version=$("$network_smoke/curl.exe" --version)
        printf '%s\n' "$curl_version"
        if ! grep -qi 'Schannel' <<<"$curl_version"; then
          echo "::error::The release libcurl is not using Windows Schannel"
          exit 1
        fi
        "$network_smoke/curl.exe" --fail --silent --show-error \
          --output "$RUNNER_TEMP/frametee-maps.json" \
          https://raw.githubusercontent.com/Teero888/tw-thumbs/refs/heads/master/maps.json
        require_file "$RUNNER_TEMP/frametee-maps.json"

        (
          cd artifact/frametee-windows
          require_file data/games/ddnet/shaders/map.frag.spv
          require_file data/games/ddnet/skins/default.png
          require_file data/games/ddnet/textures/emoticons.png
          require_file data/fonts/DejaVuSans.ttf
          require_file data/fonts/DejaVuSans-LICENSE.txt
          require_file data/games/tmnf/thumbnail.png
          require_file data/games/tmnf/README.txt
          require_file vulkan-1.dll
          # See the Linux job: one directory per plugin, named after it.
          require_file plugins/example_c/example_c.dll
          require_file plugins/example_cpp/example_cpp.dll
          require_file plugins/physics_profiler/physics_profiler.dll
          require_file plugins/random_input_filler/random_input_filler.dll
          require_file plugins/physics_profiler/plugin.toml
          require_file plugins/random_input_filler/plugin.toml
          test -z "$(find plugins -type f ! -iname '*.dll' ! -iname '*.toml' -print -quit)"
          test ! -d data/textures
          test ! -f data/fonts/JetBrainsMono-Medium.ttf
          test -z "$(find . -type f \( -name '*.o' -o -name '*.a' -o -name '*.cmake' -o -name '*.pdb' -o -name '*.glsl' -o -name '*.ilk' -o -name '*.lib' -o -name '*.exp' \) -print -quit)"
          ./frametee.exe --list-games | tee "$RUNNER_TEMP/frametee-game-modules.txt"
          grep -Eq '^  ddnet[[:space:]]' "$RUNNER_TEMP/frametee-game-modules.txt"
          grep -Eq '^  tmnf[[:space:]]' "$RUNNER_TEMP/frametee-game-modules.txt"

          # See the Linux job: --list-games never reaches the editor. This does,
          # and Windows is where it matters, because the loader lock is held
          # while a library attaches and detaches -- a plugin that starts or
          # joins a thread there deadlocks startup before the first frame.
          smoke_config="$RUNNER_TEMP/frametee-config"
          rm -rf "$smoke_config"
          mkdir -p "$smoke_config/frametee"
          : > "$RUNNER_TEMP/frametee-smoke.ftscript"
          # The editor reads APPDATA with the Win32 API, not through MSYS2's
          # path translation, so it has to be handed a native path.
          smoke_appdata=$(cygpath -m "$smoke_config")

          APPDATA="$smoke_appdata" timeout 120 \
            ./frametee.exe --auto "$RUNNER_TEMP/frametee-smoke.ftscript" |
            tee "$RUNNER_TEMP/frametee-startup.txt"
          grep -q "Scanning for plugins" "$RUNNER_TEMP/frametee-startup.txt"
          grep -q "Auto script finished" "$RUNNER_TEMP/frametee-startup.txt"
          ! grep -q "Loaded '" "$RUNNER_TEMP/frametee-startup.txt"

          {
            echo "[plugins]"
            for plugin in plugins/*/; do
              echo "$(basename "$plugin") = true"
            done
          } > "$smoke_config/frametee/config.toml"
          APPDATA="$smoke_appdata" timeout 120 \
            ./frametee.exe --auto "$RUNNER_TEMP/frametee-smoke.ftscript" |
            tee "$RUNNER_TEMP/frametee-plugins.txt"
          grep -q "Loaded '" "$RUNNER_TEMP/frametee-plugins.txt"
          grep -q "Auto script finished" "$RUNNER_TEMP/frametee-plugins.txt"
          find . -type f -print | sort
        )

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frametee-windows
        path: artifact/frametee-windows/

  release:
    name: Create Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create archives
      run: |
        set -euo pipefail
        # download-artifact restores contents but not the executable bit, so
        # frametee arrives as 0644 and the release archive would ship a file
        # users have to chmod before it will run.
        chmod +x artifacts/frametee-linux/frametee
        find artifacts/frametee-linux -type f -name "*.so*" -exec chmod +x {} +
        test -x artifacts/frametee-linux/frametee

        tar -czvf frametee-linux.tar.gz -C artifacts frametee-linux
        (cd artifacts && zip -r ../frametee-windows.zip frametee-windows)

        # Both archives extract into one platform-named directory, and tar
        # records the executable mode instead of requiring a manual chmod.
        tar -tvzf frametee-linux.tar.gz frametee-linux/frametee | grep -q '^-rwxr-xr-x'
        unzip -Z1 frametee-windows.zip | grep -x 'frametee-windows/frametee.exe' > /dev/null
        test "$(tar -tzf frametee-linux.tar.gz | cut -d/ -f1 | sort -u)" = "frametee-linux"
        test "$(unzip -Z1 frametee-windows.zip | cut -d/ -f1 | sort -u)" = "frametee-windows"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          frametee-linux.tar.gz
          frametee-windows.zip
        generate_release_notes: true
